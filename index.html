<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">
  <title>RotiYa - Rotisería</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">

  <header class="header">
    <div class="status-space"></div>
    <img class="logo" src="assets/logo.png" alt="RotiYa">
    <div class="header-icons">
      <button aria-label="Notificaciones">◔</button>
      <button aria-label="Carrito" id="cartOpen">🛒<span id="cartCount">0</span></button>
    </div>
  </header>

  <main>
    <section class="top-area">
      <div class="search">
        <span>⌕</span>
        <input id="searchInput" type="search" placeholder="Buscar productos, comidas o categorías...">
      </div>

      <section class="hero">
        <div class="hero-copy">
          <div class="script">El sabor casero</div>
          <div class="script red">en tu mesa</div>
          <div class="red-line"></div>
          <div class="hero-tags">ROTISERÍA <b>•</b> COMIDAS <b>•</b> ENSALADAS</div>
        </div>
        <img src="assets/pollo-asado.jpg" alt="Pollo asado" class="hero-photo">
      </section>

      <section class="stores">
        <button class="arrow left" id="storePrev">‹</button>
        <div class="store-track" id="storeTrack"></div>
        <button class="arrow right" id="storeNext">›</button>
        <div class="dots" id="storeDots"></div>
      </section>
    </section>

    <section class="offers">
      <div class="offers-title">
        <span class="flame">♨</span>
        <h1>OFERTAS <b>DEL DÍA</b></h1>
        <span class="spark">✦</span>
      </div>
      <div class="products" id="products"></div>
    </section>
  </main>

  <aside class="cart" id="cart">
    <div class="cart-head">
      <h2>Tu pedido</h2>
      <button id="cartClose">×</button>
    </div>
    <div id="cartItems"></div>
    <div class="cart-total">
      <span>Total</span><strong id="cartTotal">$ 0</strong>
    </div>
    <button class="checkout" id="checkout">Continuar pedido</button>
  </aside>
  <div class="shade" id="shade"></div>

</div>
<script src="app.js"></script>
</body>
</html>
