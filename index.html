<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>RotiYa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
<header class="header">
  <img src="assets/logo.png" class="logo" alt="RotiYa">
  <button class="cart-button" id="cartOpen">🛒<span id="cartCount">0</span></button>
</header>

<section class="white-zone">
  <div class="search"><span>⌕</span><input id="search" placeholder="Buscar productos, comidas o categorías..." type="search"></div>

  <div class="hero">
    <img src="assets/hero-banner.jpg" alt="El sabor casero en tu mesa">
  </div>

  <div class="stores-wrap">
    <button class="store-arrow left" id="prev">‹</button>
    <div class="stores" id="stores"></div>
    <button class="store-arrow right" id="next">›</button>
    <div class="dots" id="dots"></div>
  </div>
</section>

<section class="offers">
  <div class="offers-heading">
    <span>♨</span><h1>OFERTAS <b>DEL DÍA</b></h1><span>✦</span>
  </div>
  <div class="products" id="products"></div>
</section>

<aside class="cart" id="cart">
  <div class="cart-head"><h2>Tu pedido</h2><button id="cartClose">×</button></div>
  <div id="cartItems"></div>
  <div class="total"><span>Total</span><strong id="total">$ 0</strong></div>
  <button class="checkout" id="checkout">Continuar pedido</button>
</aside>
<div class="shade" id="shade"></div>
</div>
<script src="app.js"></script>
</body>
</html>
